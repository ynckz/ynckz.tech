name: deploy

# Каждый коммит в main/master собирает сайт и выкладывает его на Cloudflare Workers.
# Ветку можно поменять ниже, если у тебя она называется иначе.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZINE_VERSION: "0.14.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zine
        run: |
          curl -fsSL -o zine.tar.xz \
            "https://github.com/kristoff-it/zine/releases/download/v${ZINE_VERSION}/x86_64-linux-musl.tar.xz"
          tar -xJf zine.tar.xz
          chmod +x ./zine

      - name: Build site
        run: |
          rm -rf public
          ./zine release
          test -f public/index.html
          test -f public/assets.css
          test -f public/ynckz.webp

      - name: Check page budget
        run: |
          python3 - <<'PY'
          import gzip, pathlib, sys
          size = len(gzip.compress(pathlib.Path("public/index.html").read_bytes(), 9))
          print(f"index.html gzip: {size} B (limit 14600)")
          sys.exit(0 if size < 14600 else 1)
          PY

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
