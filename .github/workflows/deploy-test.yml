name: deploy-test

# Ветка feat/allo-cyr — только тестовый домен test.ynckz.tech.
# Боевой ynckz.tech деплоится из deploy.yml на main/master.
on:
  push:
    branches: [feat/allo-cyr]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZINE_VERSION: "0.14.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zine
        run: |
          curl -fsSL -o zine.tar.xz \
            "https://github.com/kristoff-it/zine/releases/download/v${ZINE_VERSION}/x86_64-linux-musl.tar.xz"
          tar -xJf zine.tar.xz
          chmod +x ./zine

      - name: Build site
        run: |
          rm -rf public
          ./zine release
          test -f public/index.html
          test -f public/assets.css
          test -f public/ynckz.webp
          test -f public/favicon.webp
          test -f public/ogcontacts.webp

      - name: Check page budget
        run: |
          python3 - <<'PY'
          import gzip, pathlib, sys
          size = len(gzip.compress(pathlib.Path("public/index.html").read_bytes(), 9))
          print(f"index.html gzip: {size} B (limit 14600)")
          sys.exit(0 if size < 14600 else 1)
          PY

      - name: Check structured data
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          html = pathlib.Path("public/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          if not blocks:
              sys.exit("no JSON-LD block found")
          for i, block in enumerate(blocks):
              try:
                  json.loads(block)
              except Exception as exc:
                  sys.exit(f"JSON-LD block #{i} is not valid JSON: {exc}")
          print(f"JSON-LD ok: {len(blocks)} block(s)")
          PY

      # Тестовый домен не должен попадать в поиск.
      - name: Add noindex robots.txt
        run: |
          printf 'User-agent: *\nDisallow: /\n' > public/robots.txt

      - name: Deploy to Cloudflare Workers (test)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.test.jsonc
